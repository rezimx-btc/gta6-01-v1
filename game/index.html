<!-- SOLMAR — Streets of Gold. A complete open-world crime game in one static folder:
     five districts, traffic and pedestrians, cars to steal, wanted stars and police who
     hunt them, six missions in three acts, taxi fares and package runs, combat, a HUD with
     a minimap, a start screen and a localStorage save. No build step, no network. -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>SOLMAR — Streets of Gold</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #10141c; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="SOLMAR Streets of Gold: an open-world crime game. Drive, steal cars, outrun the police and rise from Courier to Kingpin."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
